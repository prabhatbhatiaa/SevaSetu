<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SevaSetu connects people who need local help with nearby volunteers, matched by skill, distance and availability."
    />
    <meta name="theme-color" content="#0c0b0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SevaSetu — The bridge between need and kindness</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        if (localStorage.getItem('sevasetu_theme') === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch (error) {
        /* storage blocked — keep the dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
